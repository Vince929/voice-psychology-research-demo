[project]
name = "voice-psychology-api"
version = "1.0.0"
description = "Local API for the anxiety support agent (non-medical supportive tool)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pymysql>=1.1,<2.0",
  "python-multipart>=0.0.9,<1.0",
  "python-dotenv>=1.0,<2.0",
  "requests>=2.32,<3.0",
  "bcrypt>=4.0,<5.0",
  "pyjwt>=2.8,<3.0",
  "pydantic>=2.7,<3.0",
  "yoyo-migrations>=9.0,<10.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
