[project]
name = "voice-psychology-api"
version = "0.1.0"
description = "Local API for the voice psychology research collection demo"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pymysql>=1.1,<2.0",
  "python-multipart>=0.0.9,<1.0",
  "python-dotenv>=1.0,<2.0",
  "requests>=2.32,<3.0",
  "cos-python-sdk-v5>=1.9,<2.0",
  "yoyo-migrations>=9.0,<10.0"
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
