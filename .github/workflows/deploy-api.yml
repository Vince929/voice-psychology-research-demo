name: Deploy Voice Psychology API

on:
  push:
    branches:
      - master
    paths:
      - 'apps/api/**'
      - 'db/migrations/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy API
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            APP_DIR="$HOME/voice-psychology-research-demo"
            REPOSITORY_URL="${{ github.server_url }}/${{ github.repository }}.git"

            if [[ ! -d "$APP_DIR/.git" ]]; then
              git clone --branch master --single-branch "$REPOSITORY_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git pull --ff-only origin master

            ENV_FILE="apps/api/.env"
            touch "$ENV_FILE"

            upsert_env() {
              key="$1"
              value="$2"
              if grep -q "^${key}=" "$ENV_FILE"; then
                sed -i "s|^${key}=.*|${key}=${value}|" "$ENV_FILE"
              else
                printf '%s=%s\n' "$key" "$value" >> "$ENV_FILE"
              fi
            }

            upsert_env "DATABASE_URL" "mysql+pymysql://voice_demo_app:${{ vars.MYSQL_PASSWORD }}@mysql:3306/voice_psychology_demo?charset=utf8mb4"
            upsert_env "AUDIO_COS_BUCKET" "${{ vars.AUDIO_COS_BUCKET }}"
            upsert_env "AUDIO_COS_REGION" "${{ vars.AUDIO_COS_REGION }}"
            upsert_env "AUDIO_COS_SECRET_ID" "${{ vars.AUDIO_COS_SECRET_ID }}"
            upsert_env "AUDIO_COS_SECRET_KEY" "${{ vars.AUDIO_COS_SECRET_KEY }}"
            upsert_env "AUDIO_COS_KEY_PREFIX" "${{ vars.AUDIO_COS_KEY_PREFIX }}"
            upsert_env "DEEPSEEK_API_KEY" "${{ vars.DEEPSEEK_API_KEY }}"
            upsert_env "DEEPSEEK_BASE_URL" "${{ vars.DEEPSEEK_BASE_URL }}"
            upsert_env "DEEPSEEK_MODEL" "${{ vars.DEEPSEEK_MODEL }}"

            export MYSQL_PASSWORD="${{ vars.MYSQL_PASSWORD }}"
            if [[ -z "$MYSQL_PASSWORD" ]]; then
              echo "MYSQL_PASSWORD GitHub Variable must be configured" >&2
              exit 1
            fi
            export MYSQL_ROOT_PASSWORD="$MYSQL_PASSWORD"
            export MYSQL_DATABASE="voice_psychology_demo"
            export MYSQL_USER="voice_demo_app"
            docker compose -f docker-compose.prod.yml build api
            if ! docker compose -f docker-compose.prod.yml up -d --wait mysql; then
              docker compose -f docker-compose.prod.yml logs mysql
              exit 1
            fi
            docker compose -f docker-compose.prod.yml run --rm --no-deps api sh -c 'yoyo apply --batch --database "$(printf "%s" "$DATABASE_URL" | sed "s#^mysql+pymysql:#mysql:#")" db/migrations'
            docker compose -f docker-compose.prod.yml up -d api

      - name: Done
        run: echo "Voice Psychology API deployment completed"
