name: Deploy Voice Psychology API

on:
  push:
    branches:
      - master
    paths:
      - 'apps/api/**'
      - 'db/migrations/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy API
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load deployment target
        id: deployment_target
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . apps/api/.env.prod
          set +a
          test -n "${SERVER_HOST:-}" && test "$SERVER_HOST" != "your-server-host"
          test -n "${SERVER_USER:-}" && test "$SERVER_USER" != "your-server-user"
          echo "server_host=$SERVER_HOST" >> "$GITHUB_OUTPUT"
          echo "server_user=$SERVER_USER" >> "$GITHUB_OUTPUT"

      # apps/api/.env.prod: SERVER_HOST. Secrets: SERVER_USER, SERVER_SSH_KEY,
      # DATABASE_URL, JWT_SECRET, TENCENT_SECRET_ID, TENCENT_SECRET_KEY, DEEPSEEK_API_KEY.
      # Non-sensitive runtime settings are versioned in apps/api/.env.prod.
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.deployment_target.outputs.server_host }}
          username: ${{ steps.deployment_target.outputs.server_user }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            APP_DIR="$HOME/voice-psychology-research-demo"
            REPOSITORY_URL="${{ github.server_url }}/${{ github.repository }}.git"

            if [[ ! -d "$APP_DIR/.git" ]]; then
              git clone --branch master --single-branch "$REPOSITORY_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            # .env.prod is versioned for non-sensitive settings. Restore its
            # tracked content before pulling because the previous deployment
            # injected credentials into the working copy.
            git restore apps/api/.env.prod
            git pull --ff-only origin master

            ENV_FILE="apps/api/.env.prod"
            touch "$ENV_FILE"

            upsert_env() {
              key="$1"
              value="$2"
              tmp_file="$(mktemp "${ENV_FILE}.XXXXXX")"
              grep -v "^${key}=" "$ENV_FILE" > "$tmp_file" || true
              printf '%s=%s\n' "$key" "$value" >> "$tmp_file"
              mv "$tmp_file" "$ENV_FILE"
              chmod 600 "$ENV_FILE"
            }

            require_value() {
              key="$1"
              value="$2"
              if [[ -z "$value" ]]; then
                echo "GitHub Secret or Variable ${key} must be configured" >&2
                exit 1
              fi
            }

            # apps/api/.env.prod supplies non-sensitive settings. GitHub Secrets
            # supply only credentials and signing keys for this deployment.
            require_value "DATABASE_URL" "${{ secrets.DATABASE_URL }}"
            require_value "JWT_SECRET" "${{ secrets.JWT_SECRET }}"
            require_value "TENCENT_SECRET_ID" "${{ secrets.TENCENT_SECRET_ID }}"
            require_value "TENCENT_SECRET_KEY" "${{ secrets.TENCENT_SECRET_KEY }}"
            require_value "DEEPSEEK_API_KEY" "${{ secrets.DEEPSEEK_API_KEY }}"

            # The shared MySQL master is reachable from containers by its Docker
            # service name, not by the container-local 127.0.0.1 address.
            DATABASE_URL_VALUE="${{ secrets.DATABASE_URL }}"
            DATABASE_URL_VALUE="${DATABASE_URL_VALUE/#mysql:\/\//mysql+pymysql:\/\/}"
            DATABASE_URL_VALUE="$(printf '%s' "$DATABASE_URL_VALUE" | sed -E 's#@(127\.0\.0\.1|mysql):3306/#@mysql-master:3306/#')"
            remove_env() {
              key="$1"
              tmp_file="$(mktemp "${ENV_FILE}.XXXXXX")"
              grep -v "^${key}=" "$ENV_FILE" > "$tmp_file" || true
              mv "$tmp_file" "$ENV_FILE"
              chmod 600 "$ENV_FILE"
            }

            # Remove legacy credential names now that ASR only reads TENCENT_*.
            remove_env "AUDIO_COS_SECRET_ID"
            remove_env "AUDIO_COS_SECRET_KEY"
            remove_env "TENCENTCLOUD_SECRET_ID"
            remove_env "TENCENTCLOUD_SECRET_KEY"

            upsert_env "DATABASE_URL" "$DATABASE_URL_VALUE"
            upsert_env "JWT_SECRET" "${{ secrets.JWT_SECRET }}"
            upsert_env "TENCENT_SECRET_ID" "${{ secrets.TENCENT_SECRET_ID }}"
            upsert_env "TENCENT_SECRET_KEY" "${{ secrets.TENCENT_SECRET_KEY }}"
            upsert_env "DEEPSEEK_API_KEY" "${{ secrets.DEEPSEEK_API_KEY }}"

            export STARLOG_NETWORK="$(docker inspect --format '{{range $network, $_ := .NetworkSettings.Networks}}{{$network}}{{end}}' starlog-mysql-master)"
            if [[ -z "$STARLOG_NETWORK" ]]; then
              echo "Unable to resolve the Docker network for starlog-mysql-master" >&2
              exit 1
            fi
            docker compose -f docker-compose.prod.yml build api worker
            echo "Using shared Starlog MySQL network: $STARLOG_NETWORK"
            echo "Creating the target schema if needed..."
            docker compose -f docker-compose.prod.yml run --rm --no-deps api python -c "import os; import pymysql; from urllib.parse import urlparse; u = urlparse(os.environ['DATABASE_URL']); db = u.path.lstrip('/'); assert db.replace('_', '').isalnum(); c = pymysql.connect(host=u.hostname, port=u.port or 3306, user=u.username, password=u.password, charset='utf8mb4'); q = c.cursor(); q.execute('CREATE DATABASE IF NOT EXISTS ' + db + ' CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'); c.commit(); c.close(); print('Ensured schema: ' + db)"
            echo "Applying Yoyo database migrations..."
            docker compose -f docker-compose.prod.yml run --rm --no-deps api sh -ec '
              yoyo_database_url="$(printf "%s" "$DATABASE_URL" | sed "s#^mysql+pymysql:#mysql:#")"
              yoyo apply --batch --database "$yoyo_database_url" db/migrations
              echo "Yoyo migration status:"
              yoyo list --database "$yoyo_database_url" db/migrations
              echo "Connected database and tables:"
              python -c "import os; import pymysql; from urllib.parse import urlparse; u = urlparse(os.environ[\"DATABASE_URL\"]); c = pymysql.connect(host=u.hostname, port=u.port or 3306, user=u.username, password=u.password, database=u.path.lstrip(\"/\")); q = c.cursor(); q.execute(\"SELECT DATABASE(), @@hostname, @@port\"); print(q.fetchone()); q.execute(\"SHOW TABLES\"); print([r[0] for r in q.fetchall()]); c.close()"
            '
            echo "Yoyo database migrations completed"
            docker compose -f docker-compose.prod.yml up -d --remove-orphans api worker

      - name: Done
        run: echo "Voice Psychology API deployment completed"
