name: Deploy Voice Psychology API

on:
  push:
    branches:
      - master
    paths:
      - 'apps/api/**'
      - 'db/migrations/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy API
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            APP_DIR="$HOME/voice-psychology-research-demo"
            REPOSITORY_URL="${{ github.server_url }}/${{ github.repository }}.git"

            if [[ ! -d "$APP_DIR/.git" ]]; then
              git clone --branch master --single-branch "$REPOSITORY_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git pull --ff-only origin master

            ENV_FILE="apps/api/.env"
            touch "$ENV_FILE"

            upsert_env() {
              key="$1"
              value="$2"
              if grep -q "^${key}=" "$ENV_FILE"; then
                sed -i "s|^${key}=.*|${key}=${value}|" "$ENV_FILE"
              else
                printf '%s=%s\n' "$key" "$value" >> "$ENV_FILE"
              fi
            }

            upsert_env "AUDIO_COS_BUCKET" "${{ vars.AUDIO_COS_BUCKET }}"
            upsert_env "AUDIO_COS_REGION" "${{ vars.AUDIO_COS_REGION }}"
            upsert_env "AUDIO_COS_SECRET_ID" "${{ vars.AUDIO_COS_SECRET_ID }}"
            upsert_env "AUDIO_COS_SECRET_KEY" "${{ vars.AUDIO_COS_SECRET_KEY }}"
            upsert_env "AUDIO_COS_KEY_PREFIX" "${{ vars.AUDIO_COS_KEY_PREFIX }}"
            upsert_env "TENCENTCLOUD_APP_ID" "${{ vars.TENCENTCLOUD_APP_ID }}"
            upsert_env "DEEPSEEK_API_KEY" "${{ vars.DEEPSEEK_API_KEY }}"
            upsert_env "DEEPSEEK_BASE_URL" "${{ vars.DEEPSEEK_BASE_URL }}"
            upsert_env "DEEPSEEK_MODEL" "${{ vars.DEEPSEEK_MODEL }}"

            # GitHub Secrets take precedence over Variables so every deployment replaces any
            # stale server-side value. The shared MySQL master is reachable from containers by
            # its Docker service name, not by the container-local 127.0.0.1 address.
            DATABASE_URL_VALUE="${{ secrets.DATABASE_URL || vars.DATABASE_URL }}"
            if [[ -z "$DATABASE_URL_VALUE" ]]; then
              echo "GitHub DATABASE_URL Secret or Variable must be configured" >&2
              exit 1
            fi
            DATABASE_URL_VALUE="${DATABASE_URL_VALUE/#mysql:\/\//mysql+pymysql://}"
            DATABASE_URL_VALUE="$(printf '%s' "$DATABASE_URL_VALUE" | sed -E 's#@(127\.0\.0\.1|mysql):3306/#@mysql-master:3306/#')"
            upsert_env "DATABASE_URL" "$DATABASE_URL_VALUE"

            export STARLOG_NETWORK="$(docker inspect --format '{{range $network, $_ := .NetworkSettings.Networks}}{{$network}}{{end}}' starlog-mysql-master)"
            if [[ -z "$STARLOG_NETWORK" ]]; then
              echo "Unable to resolve the Docker network for starlog-mysql-master" >&2
              exit 1
            fi
            docker compose -f docker-compose.prod.yml build api worker
            echo "Using shared Starlog MySQL network: $STARLOG_NETWORK"
            echo "Creating the target schema if needed..."
            docker compose -f docker-compose.prod.yml run --rm --no-deps api python -c "import os; import pymysql; from urllib.parse import urlparse; u = urlparse(os.environ['DATABASE_URL']); db = u.path.lstrip('/'); assert db.replace('_', '').isalnum(); c = pymysql.connect(host=u.hostname, port=u.port or 3306, user=u.username, password=u.password, charset='utf8mb4'); q = c.cursor(); q.execute('CREATE DATABASE IF NOT EXISTS ' + db + ' CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'); c.commit(); c.close(); print('Ensured schema: ' + db)"
            echo "Applying Yoyo database migrations..."
            docker compose -f docker-compose.prod.yml run --rm --no-deps api sh -ec '
              yoyo_database_url="$(printf "%s" "$DATABASE_URL" | sed "s#^mysql+pymysql:#mysql:#")"
              yoyo apply --batch --database "$yoyo_database_url" db/migrations
              echo "Yoyo migration status:"
              yoyo list --database "$yoyo_database_url" db/migrations
              echo "Connected database and tables:"
              python -c "import os; import pymysql; from urllib.parse import urlparse; u = urlparse(os.environ[\"DATABASE_URL\"]); c = pymysql.connect(host=u.hostname, port=u.port or 3306, user=u.username, password=u.password, database=u.path.lstrip(\"/\")); q = c.cursor(); q.execute(\"SELECT DATABASE(), @@hostname, @@port\"); print(q.fetchone()); q.execute(\"SHOW TABLES\"); print([r[0] for r in q.fetchall()]); c.close()"
            '
            echo "Yoyo database migrations completed"
            docker compose -f docker-compose.prod.yml up -d --remove-orphans api worker

      - name: Done
        run: echo "Voice Psychology API deployment completed"
