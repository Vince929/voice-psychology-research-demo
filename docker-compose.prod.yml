services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: voice-psychology-api
    ports:
      - "8443:8000"
    env_file:
      - apps/api/.env
    restart: unless-stopped
    networks:
      - voice-psychology-net
      - starlog-net

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: voice-psychology-worker
    command: ["python", "-m", "app.worker"]
    env_file:
      - apps/api/.env
    restart: unless-stopped
    networks:
      - voice-psychology-net
      - starlog-net
networks:
  voice-psychology-net:
    driver: bridge
  starlog-net:
    external: true
    name: ${STARLOG_NETWORK:?STARLOG_NETWORK must identify the Starlog MySQL Docker network}
